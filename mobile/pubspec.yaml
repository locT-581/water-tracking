name: smart_hydro
description: SmartHydro - Hydration tracking app tuned to your biology.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Fonts
  google_fonts: ^6.1.0

  # State & Architecture
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^17.0.1

  # Storage
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2

  # Supabase
  supabase_flutter: ^2.3.0

  # Health & Sensors
  health: ^13.2.1
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  connectivity_plus: ^7.0.0

  # Notifications
  flutter_local_notifications: ^19.5.0
  workmanager: ^0.9.0+3
  timezone: ^0.10.1

  # UI/UX
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  confetti: ^0.8.0
  fl_chart: ^1.1.1
  flutter_heatmap_calendar: ^1.0.5
  haptic_feedback: ^0.6.4+3
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utils
  easy_localization: ^3.0.3
  intl: ^0.20.2
  share_plus: ^12.0.1
  url_launcher: ^6.2.2
  device_info_plus: ^12.3.0
  flutter_dotenv: ^6.0.0
  uuid: ^4.2.2
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  dio: ^5.4.0
  logger: ^2.0.2+1
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.1
  golden_toolkit: ^0.15.0
  isar_generator: ^3.1.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - assets/translations/
    - .env

